[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "predictkv"
version = "1.0.0"
description = "PredictKV: Temporal Predictive Coding for Transformer KV States"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest>=7"]
